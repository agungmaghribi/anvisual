<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lacak Pesanan — an.visual</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b10;--sf:#15151d;--tx:#f4f4f6;--mu:#a0a0ad;--ac:#d4ff3f;--ac-t:#0b0b10;--bd:#26263a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 'Plus Jakarta Sans',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:620px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
.logo{height:30px;max-width:58%;width:auto;display:block}
.btn{display:inline-block;background:var(--ac);color:var(--ac-t);font:800 14px/1.2 'Plus Jakarta Sans',system-ui,sans-serif;padding:12px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:28px 0 8px;font-weight:800}
.hl{color:var(--ac)}.mu{color:var(--mu)}
.tf{display:flex;gap:8px;margin:22px 0}
.tf input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:14px 20px;font:600 16px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.tf input:focus{outline:2px solid var(--ac)}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:22px}
.code{font-size:22px;font-weight:800;letter-spacing:.05em}
.badge{display:inline-block;background:var(--ac);color:var(--ac-t);font-weight:800;font-size:13px;border-radius:999px;padding:4px 14px;margin:8px 0}
.st{list-style:none;padding:0;margin:20px 0 4px}
.st li{position:relative;padding:0 0 22px 46px;color:var(--mu)}
.st li:last-child{padding-bottom:0}
.st li::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--bd)}
.st li:last-child::before{display:none}
.st li.done::before{background:var(--ac)}
.dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--bg)}
.done .dot{background:var(--ac);border-color:var(--ac);color:var(--ac-t)}
.st li.cur{color:var(--tx)}.cur .dot{border-color:var(--ac);color:var(--ac);animation:pu 2s infinite}
.st b{display:block;font-size:16px}.st span{font-size:14px}
.done b{color:var(--tx)}
.nt{border-top:1px solid var(--bd);margin-top:20px;padding-top:16px;font-size:15px}
.err{border-color:#ff6b4a}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(212,255,63,.5)}70%{box-shadow:0 0 0 10px rgba(212,255,63,0)}100%{box-shadow:0 0 0 0 rgba(212,255,63,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 0 40px}
</style></head><body><div class="w">

<h1>Lacak <span class="hl">Pesanan</span></h1>
<p class="mu">Masukkan nomor order yang kamu terima dari an.visual untuk melihat sampai mana videomu dikerjakan.</p>

<script>
var S=[["Pesanan diterima","Order sudah tercatat di an.visual."],["Brief & bahan dicek","Kami memeriksa footage dan arahan darimu."],["Proses editing","Videomu sedang dikerjakan."],["Review & revisi","Hasil dikirim untuk kamu cek, revisi dikerjakan bila ada."],["Selesai","Video final sudah siap dan dikirim."]];
// Isi dengan URL Web app dari Google Apps Script. Kosongkan untuk memakai orders.json.
var API_URL='https://script.google.com/macros/s/AKfycbxLyLd5yr4ySXdm0dS-x91DADObuaOeJJRVXGyu9nYzgjQas5ul6qn509aMEepP0cfRyg/exec';
var r=document.getElementById('r');
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function fmt(n){return n.length==10?n.slice(0,2)+'-'+n.slice(2,6)+'-'+n.slice(6):n}
function dt(s){if(!s)return '';var d=new Date(s+'T00:00:00');return isNaN(d)?esc(s):d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function msg(t){r.innerHTML='<div class="c err">'+t+'</div>'}
async function cari(raw){
 var n=norm(raw);if(n.length<6){msg('Nomor order belum lengkap. Periksa lagi penulisannya.');return}
 r.innerHTML='<p class="mu">Mencari…</p>';
 try{
  var o,res;
  if(API_URL){res=await fetch(API_URL+'?kode='+encodeURIComponent(n));if(!res.ok)throw 0;var j=await res.json();o=j.found?j:null}
  else{res=await fetch('orders.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw 0;var db=await res.json();o=db.orders[await sha('anvisual:'+n)]}
  if(!o){msg('Nomor order <b>'+esc(fmt(n))+'</b> tidak ditemukan. Periksa penulisannya atau hubungi kami lewat <a href="https://ig.me/m/an.visual.id" style="color:var(--ac)">DM Instagram</a>.');return}
  var cur=Math.max(0,Math.min(S.length-1,+o.stage||0));
  var li=S.map(function(s,i){var c=i<cur||(i==cur&&cur==S.length-1)?'done':i==cur?'cur':'';return '<li class="'+c+'"><i class="dot">'+(c=='done'?'✓':i+1)+'</i><b>'+s[0]+'</b><span>'+s[1]+'</span></li>'}).join('');
  r.innerHTML='<div class="c"><div class="mu" style="font-size:13px">Nomor order</div><div class="code">'+esc(fmt(n))+'</div><span class="badge">'+S[cur][0]+'</span><ol class="st">'+li+'</ol>'+
   (o.note?'<div class="nt"><b>Catatan dari an.visual</b><br>'+esc(o.note)+'</div>':'')+
   '<div class="nt mu" style="font-size:13px">'+(o.eta&&cur<S.length-1?'Perkiraan selesai: '+dt(o.eta)+'<br>':'')+(o.updated?'Terakhir diperbarui: '+dt(o.updated):'')+'</div></div>';
 }catch(e){msg('Data pesanan belum bisa dimuat. Coba lagi sebentar lagi atau hubungi kami lewat DM.')}
}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('k').value;history.replaceState(null,'','?kode='+encodeURIComponent(v));cari(v)});
var q=new URLSearchParams(location.search).get('kode');if(q){document.getElementById('k').value=q;cari(q)}
</script></body></html>
